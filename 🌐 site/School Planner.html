<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>School Planner</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);--bg:#050505;--g1:rgba(190,70,10,.40);--g2:rgba(120,25,25,.30);--g3:rgba(232,97,10,.16);--tint:#e8610a;--tint2:#b84705;--acc:#e8610a;--acc2:#b84705;--accbg:rgba(232,97,10,.2);--ink:#f5f5f7;--mute:#98989f;--line:transparent;--line2:transparent;--card:rgba(255,255,255,.07);--surf:rgba(255,255,255,.06);--surf2:rgba(255,255,255,.1);--ok:#32d74b;--bad:#ff453a;--hl:none;--ease:cubic-bezier(.32,.72,0,1);--pop:cubic-bezier(.34,1.3,.64,1);color-scheme:dark}
html{background:var(--bg);-webkit-text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;color:var(--ink);background:var(--bg);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Roboto",system-ui,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
main{position:relative;z-index:1;max-width:620px;margin:0 auto;padding:14px 14px calc(116px + env(safe-area-inset-bottom,0px))}
button,input,select{font:inherit;color:inherit;touch-action:manipulation}
.bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0;contain:strict}
.bg i{position:absolute;border-radius:50%;will-change:transform}
.bg i:nth-child(1){width:120vmax;height:120vmax;left:-45vmax;top:-70vmax;background:radial-gradient(circle,var(--g1),transparent 62%);animation:drift 42s ease-in-out infinite alternate}
.bg i:nth-child(2){width:110vmax;height:110vmax;right:-60vmax;top:20vh;background:radial-gradient(circle,var(--g2),transparent 62%);animation:drift 55s ease-in-out infinite alternate-reverse}
.bg i:nth-child(3){width:100vmax;height:100vmax;left:-20vmax;bottom:-70vmax;background:radial-gradient(circle,var(--g3),transparent 62%)}
@keyframes drift{to{transform:translate3d(14vmax,10vmax,0)}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes burst{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
@keyframes rip{to{transform:scale(1);opacity:0}}
@keyframes slR{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes slL{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes tabPop{0%{transform:scale(.8)}60%{transform:scale(1.15)}100%{transform:none}}
@keyframes nowp{50%{opacity:.5}}
.ic{flex:none;vertical-align:-3px;stroke-width:1.6}.ic .fl{fill:currentColor;fill-opacity:.18}
h1{font-size:32px;font-weight:800;letter-spacing:-.035em;margin:0;line-height:1.1}
h1 .logo{box-sizing:content-box;padding:7px;border-radius:13px;background:linear-gradient(145deg,rgba(232,97,10,.5),rgba(232,97,10,.14));color:#ffb27a;margin-right:10px;vertical-align:-9px}
h2{font-size:17px;font-weight:700;letter-spacing:-.02em;margin:0 0 10px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:6px 0 2px}
.meBtn{border:0;background:none;padding:0;cursor:pointer;border-radius:50%;flex:none;transition:transform .25s var(--pop)}.meBtn:active{transform:scale(.9)}
.hello{display:flex;align-items:center;gap:7px;color:var(--mute);font-size:13px;font-weight:500;margin:2px 0 14px}.hello .ic{color:var(--tint)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.tile,.card{position:relative;background:linear-gradient(160deg,rgba(255,255,255,.115),rgba(255,255,255,.045));box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 8px 22px rgba(0,0,0,.38)}
.tile::before,.card::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(135deg,rgba(255,255,255,.13) 0%,rgba(255,255,255,0) 36%);pointer-events:none}
.tile{border-radius:24px;padding:13px 12px;animation:pop .4s var(--pop) backwards}
.tile b{display:block;font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.15;background:linear-gradient(180deg,#fff,#ffb27a);-webkit-background-clip:text;background-clip:text;color:transparent}
.tile span{font-size:11px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.04em}.tile span .ic{vertical-align:-2px;margin-right:3px}
nav{position:fixed;z-index:20;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:596px;margin:0 auto;display:flex;padding:6px;border-radius:34px;background:rgba(36,30,28,.72);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 12px 32px rgba(0,0,0,.55)}
@supports not (backdrop-filter:blur(1px)){nav{background:rgba(34,28,26,.95)}}
nav .ind{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/5);border-radius:28px;background:rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.18);transition:transform .5s var(--pop),opacity .25s}
nav button{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 7px;border:0;background:none;color:var(--mute);font-size:10.5px;font-weight:600;line-height:1;cursor:pointer;transition:color .2s}
nav button span{display:block;line-height:1}nav button span .ic{display:block;margin:0}
nav button.on{color:#ff8a3d}nav button.on span{animation:tabPop .45s var(--pop)}
.card{border-radius:28px;padding:18px;margin-bottom:14px;transition:transform .25s var(--ease)}
.card.click{cursor:pointer}.card.click:active{transform:scale(.98)}
.post{content-visibility:auto;contain-intrinsic-size:auto 230px}
.enter .card{animation:slideIn .55s var(--ease) backwards}
.enter .card:nth-child(2){animation-delay:.05s}.enter .card:nth-child(3){animation-delay:.1s}.enter .card:nth-child(n+4){animation-delay:.15s}
@media (hover:hover) and (pointer:fine){.card{-webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%)}.card.click:hover{transform:translateY(-3px)}}
.empty{text-align:center;padding:22px 12px;color:var(--mute);font-weight:500}
.empty .em{display:grid;place-items:center;width:62px;height:62px;margin:0 auto 12px;border-radius:20px;background:linear-gradient(145deg,rgba(232,97,10,.35),rgba(232,97,10,.08));color:#ffb27a}
input,select{background:rgba(255,255,255,.09);border:0;border-radius:14px;padding:11px 14px;min-width:0;transition:background .2s,box-shadow .2s}
input:focus,select:focus{outline:none;background:rgba(255,255,255,.13);box-shadow:0 0 0 2px rgba(232,97,10,.55)}
input::-webkit-calendar-picker-indicator{filter:invert(.7)}select option{background:#1b1512;color:#f5f5f7}
button.b{position:relative;overflow:hidden;border:0;border-radius:999px;padding:10px 18px;font-weight:600;color:#fff;cursor:pointer;background:linear-gradient(180deg,#f26e14,#cf5208);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 4px 12px rgba(232,97,10,.3);transition:transform .2s var(--pop),opacity .2s}
button.b:active{transform:scale(.94);opacity:.9}
button.g{background:none;border:0;color:var(--mute);cursor:pointer;padding:6px 9px;border-radius:999px;transition:background .2s,transform .2s var(--pop)}button.g:active{transform:scale(.88);background:rgba(255,255,255,.1)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}.row>input{flex:1 1 120px}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
.mute{color:var(--mute);font-size:13px}.big{font-size:36px;font-weight:800;letter-spacing:-.03em}
.ok{color:var(--ok)}.no{color:var(--bad)}.ok .ic,.no .ic{vertical-align:-2px}
.pill{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:0}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;color:#fff;margin-right:6px}.tag.cat{background:rgba(255,255,255,.12);color:#ffb27a}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:0;background:rgba(255,255,255,.09);color:var(--ink);padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;position:relative;overflow:hidden;transition:transform .2s var(--pop),background .2s}
.chip:active{transform:scale(.94)}.chip.on{background:var(--tint);color:#fff}
.seg{display:flex;gap:2px;padding:3px;border-radius:14px;background:rgba(255,255,255,.08)}
.seg button{flex:1;border:0;background:none;color:var(--mute);padding:8px;border-radius:11px;font-weight:600;cursor:pointer;transition:background .25s var(--ease),color .2s}
.seg button.on{background:rgba(255,255,255,.18);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dow{font-size:11px;color:var(--mute);text-align:center;font-weight:600;text-transform:uppercase}
.day{min-height:54px;border-radius:16px;padding:6px;font-size:13px;font-weight:600;cursor:pointer;background:rgba(255,255,255,.05);overflow:hidden;transition:transform .2s var(--pop),background .2s}
.day:active{transform:scale(.92)}.day.sel{background:rgba(232,97,10,.32)}.day.h{background:rgba(232,97,10,var(--a))}
.day.today b{display:inline-block;background:var(--tint);color:#fff;border-radius:99px;min-width:22px;text-align:center;padding:0 5px}
.dots{display:flex;gap:3px;margin-top:5px;flex-wrap:wrap}.dots i{width:7px;height:7px;border-radius:50%}
.slR{animation:slR .4s var(--ease)}.slL{animation:slL .4s var(--ease)}
.item,.todo,.person,.it{display:flex;align-items:center;gap:10px;padding:11px 13px;margin-top:8px;border-radius:18px;background:rgba(255,255,255,.055)}
.item{justify-content:space-between}.item:first-of-type{margin-top:0}
.todo label{flex:1;cursor:pointer}.person .grow,.it .grow{flex:1;min-width:0}
.it{position:relative;overflow:hidden;padding-left:17px}.it::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.ib{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;flex:none;color:var(--c);background:rgba(255,255,255,.08);background:color-mix(in srgb,var(--c) 26%,transparent)}
.done{text-decoration:line-through;opacity:.5}
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:24px;height:24px;padding:0;border-radius:50%;background:rgba(255,255,255,.16);vertical-align:-7px;cursor:pointer;display:inline-grid;place-content:center;margin-right:6px;flex:none;transition:background .2s,transform .25s var(--pop)}
input[type=checkbox]:checked{background:var(--tint)}input[type=checkbox]:checked::after{content:"✓";color:#fff;font-size:14px;font-weight:800}
input[type=checkbox]:active{transform:scale(.85)}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;margin:8px 0 4px;position:relative}
.bar i{display:block;height:100%;border-radius:99px;transform-origin:left;animation:grow .8s var(--ease) backwards}.bar u{position:absolute;top:0;bottom:0;width:2px;background:#fff;opacity:.3}
.f{display:grid;grid-template-columns:84px 1fr;gap:8px;align-items:center;margin-top:8px}.f input{width:100%}
.ph{display:flex;gap:12px;align-items:center;margin-bottom:12px}.qc{flex:1;border-radius:999px}
.av{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;flex:none;background:linear-gradient(145deg,rgba(232,97,10,.5),rgba(232,97,10,.12));color:#ffb27a}
.acts{display:flex;gap:4px;margin-top:12px;padding-top:8px}
button.act{flex:1;color:var(--mute);font-weight:600;font-size:13px;position:relative;overflow:hidden}button.act .ic{margin-right:4px}
.stories{display:flex;gap:14px;overflow-x:auto;padding:2px 2px 14px;scrollbar-width:none}.stories::-webkit-scrollbar{display:none}
.story{flex:none;width:66px;text-align:center;cursor:pointer;transition:transform .2s var(--pop)}.story:active{transform:scale(.92)}
.ring{display:grid;place-items:center;width:60px;height:60px;border-radius:50%;margin:0 auto 5px;background:var(--c,var(--tint));padding:3px}
.ring b{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:#171210;font-size:20px;font-weight:700}.ring.add{background:rgba(255,255,255,.14)}
.story small{display:block;font-size:11px;font-weight:500;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.like{border:0;background:rgba(255,255,255,.1);color:var(--mute);border-radius:999px;padding:4px 11px;font-size:12px;font-weight:600;cursor:pointer;transition:transform .2s var(--pop)}.like:active{transform:scale(.9)}.like.on{background:rgba(232,97,10,.4);color:#ffb27a}
.tl{position:relative;padding-top:20px}.tk{position:absolute;top:0;transform:translateX(-50%);font-size:10px;color:var(--mute);font-weight:600;white-space:nowrap}
.tr{position:relative;height:50px;border-radius:18px;background:rgba(255,255,255,.06);overflow:hidden}
.tb{position:absolute;top:7px;bottom:7px;border-radius:13px;padding:0 9px;display:flex;align-items:center;color:#fff;font-size:11px;font-weight:700;overflow:hidden}.tb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.te{position:absolute;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:#fff}
.now{position:absolute;top:0;bottom:0;width:3px;margin-left:-1.5px;background:#fff;border-radius:3px;animation:nowp 2.4s ease-in-out infinite}
.cd{display:flex;align-items:baseline;gap:12px;margin-bottom:8px}.cd b{font-size:54px;font-weight:800;letter-spacing:-.04em;line-height:1;background:linear-gradient(180deg,#fff,#ff9a4d);-webkit-background-clip:text;background-clip:text;color:transparent}.cd span{color:var(--mute);font-weight:600}
.gauge{display:block;margin:0 auto 6px;max-width:270px;width:100%}.gauge .gt{fill:none;stroke:rgba(255,255,255,.1);stroke-width:12;stroke-linecap:round}.gauge .gf{fill:none;stroke:url(#gg);stroke-width:12;stroke-linecap:round}
.dls{display:flex;gap:8px;overflow-x:auto;margin-top:12px;padding:2px 0 4px;scrollbar-width:none}.dls::-webkit-scrollbar{display:none}
.dl{flex:none;max-width:190px;border:0;border-radius:16px;background:rgba(255,255,255,.08);color:var(--ink);padding:9px 13px;text-align:left;cursor:pointer;display:grid;gap:2px;transition:transform .2s var(--pop)}.dl:active{transform:scale(.94)}
.dl b{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dl i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px}.dl small{color:var(--mute);font-size:11px}
.wk{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 10px;scrollbar-width:none}.wk::-webkit-scrollbar{display:none}
.wc{flex:0 0 132px;scroll-snap-align:start;min-height:160px;border-radius:22px;padding:11px;background:rgba(255,255,255,.055);cursor:pointer;transition:transform .2s var(--pop)}.wc:active{transform:scale(.97)}
.wc.sel{background:linear-gradient(160deg,rgba(232,97,10,.4),rgba(232,97,10,.1))}
.wh{display:flex;align-items:baseline;gap:6px;margin-bottom:8px}.wh b{font-size:21px;font-weight:700}.wh small{color:var(--mute);font-weight:600;font-size:10.5px;text-transform:uppercase}
.wc.today .wh b{background:var(--tint);border-radius:10px;padding:0 8px}
.wi{margin-top:6px;padding:6px 8px;border-radius:11px;font-size:12px;font-weight:600;background:rgba(255,255,255,.07);box-shadow:inset 3px 0 0 var(--c)}.wi span{display:block;font-size:10px;color:var(--mute)}.wn{margin-top:14px}
.agh{margin:16px 0 4px;font-weight:700}.agh:first-of-type{margin-top:8px}
.gaps{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.gp{padding:6px 13px;border-radius:999px;font-size:12px;font-weight:600;background:rgba(50,215,75,.14);color:#6ee788}
.prof{padding:0;overflow:hidden}.pb{padding:0 20px 20px}
.cover{height:104px;background:linear-gradient(120deg,var(--c1),#12060a 88%)}.bigav{margin-top:-42px;position:relative}.bigav .pav{box-shadow:0 0 0 5px #0e0a08}
.pav{display:inline-grid;place-items:center;border-radius:50%;color:#fff;font-weight:700;flex:none;vertical-align:middle}
.pstats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}.pstat{background:rgba(255,255,255,.07);border-radius:18px;padding:10px 4px;text-align:center}
.pstat b{display:block;font-size:19px;font-weight:700}.pstat span{font-size:10px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.sw{display:flex;gap:9px;flex-wrap:wrap}.sw button{width:28px;height:28px;border-radius:50%;border:0;cursor:pointer;transition:transform .2s var(--pop)}.sw button.on{transform:scale(1.2);box-shadow:0 0 0 3px rgba(255,255,255,.85)}
.code{font:12px ui-monospace,Menlo,monospace;background:rgba(255,255,255,.07);border-radius:14px;padding:9px 12px;word-break:break-all;margin-top:4px}
.toast{position:fixed;left:14px;right:14px;bottom:calc(92px + env(safe-area-inset-bottom,0px));max-width:480px;margin:auto;padding:13px 18px;border-radius:22px;z-index:30;font-weight:600;background:rgba(40,32,28,.82);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 14px 36px rgba(0,0,0,.6);opacity:0;visibility:hidden;transform:translateY(16px) scale(.96);pointer-events:none;transition:opacity .25s,transform .4s var(--pop),visibility 0s linear .4s}
.toast.on{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.bub{position:fixed;border-radius:50%;pointer-events:none;z-index:40;animation:burst .7s var(--ease) forwards}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.28);transform:scale(0);animation:rip .55s var(--ease) forwards;pointer-events:none}
/* ===== More motion (transform/opacity only) ===== */
@keyframes slideIn{from{opacity:0;transform:translate3d(calc(var(--dir,1)*28px),16px,0) scale(.98)}to{opacity:1;transform:none}}
@keyframes navIn{from{opacity:0;transform:translateY(90px)}to{opacity:1;transform:none}}
@keyframes float{50%{transform:translateY(-6px)}}
@keyframes todayRing{0%{transform:scale(.85);opacity:.9}100%{transform:scale(1.7);opacity:0}}
@keyframes bye{to{opacity:0;transform:translateX(-44px) scale(.95)}}
@keyframes arc{from{stroke-dasharray:0 283}}
#view{transition:opacity .12s,transform .12s}#view.out{opacity:0;transform:translateY(8px)}
h1{animation:rise .6s var(--ease) backwards}
nav{animation:navIn .7s var(--pop) .15s backwards}
.top{transform-origin:left center;will-change:transform}
.rv{opacity:0;transform:translateY(28px);transition:opacity .55s var(--ease),transform .55s var(--ease)}.rv.rv-in{opacity:1;transform:none}
.enter .card.rv{animation:none}
.enter .it,.enter .todo,.enter .item,.enter .person{animation:rise .5s var(--ease) calc(.25s + var(--d,0ms)) backwards}
.enter .day{animation:pop .45s var(--pop) calc(var(--i)*14ms + .1s) backwards}
.enter .tile{animation:pop .5s var(--pop) backwards}.enter .tile:nth-child(2){animation-delay:.07s}.enter .tile:nth-child(3){animation-delay:.14s}
.enter .story{animation:pop .5s var(--pop) backwards}.enter .story:nth-child(2){animation-delay:.06s}.enter .story:nth-child(3){animation-delay:.12s}.enter .story:nth-child(n+4){animation-delay:.18s}
.enter .tb{animation:grow .8s var(--ease) .3s backwards;transform-origin:left}
.enter .cd b{animation:pop .6s var(--pop) .3s backwards}
.enter .wc{animation:rise .5s var(--ease) calc(var(--i,0)*50ms) backwards}
.gauge .gf{animation:arc 1.2s var(--ease) .2s backwards}
.empty .em{animation:float 3.6s ease-in-out infinite}
.day.today b{position:relative;isolation:isolate}.day.today b::after{content:"";position:absolute;inset:0;border-radius:99px;background:var(--tint);animation:todayRing 2.4s ease-out infinite;z-index:-1}
.bye{animation:bye .23s var(--ease) forwards;pointer-events:none}
.chip,.seg button,.dl,.hm,.day,.wc,.story{transition:transform .22s var(--pop),background .25s,color .2s}
.chip:hover,.dl:hover{transform:translateY(-2px)}
/* ===== Liquid glass ===== */
.card,.tile{background:linear-gradient(155deg,rgba(255,255,255,.14),rgba(255,255,255,.04) 55%,rgba(255,255,255,.075));box-shadow:inset 1px 1px 0 rgba(255,255,255,.24),inset -1px -1px 0 rgba(255,255,255,.05),inset 0 0 28px rgba(255,255,255,.035),0 14px 34px rgba(0,0,0,.42)}
.card::before,.tile::before{background:radial-gradient(120% 80% at 0% 0%,rgba(255,255,255,.2),rgba(255,255,255,0) 52%)}

function applyBg(){const t=myP().bg||"ember",h=document.documentElement;if(t==="photo"&&bgOk){h.style.setProperty("--bgimg",`url('${bgimg}')`);h.dataset.bg="photo"}else h.dataset.bg=t==="photo"?"ember":t}
const setBg=t=>putP({bg:t});
async function pickBg(inp){const f=inp.files&&inp.files[0];inp.value="";if(!f)return;if(!/^image\//.test(f.type)||f.size>25e6)return toast("Pick an image under 25 MB");
  try{const bm=await createImageBitmap(f),k=Math.min(1,900/Math.max(bm.width,bm.height)),c=document.createElement("canvas");c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext("2d").drawImage(bm,0,0,c.width,c.height);
    const u=c.toDataURL("image/jpeg",.72);localStorage.setItem("sp:bgimg",u);bgimg=u;bgOk=true;await putP({bg:"photo"});toast("Background updated")}catch(e){toast("Couldn't use that picture")}}
const removeBg=()=>{bgimg=null;bgOk=false;try{localStorage.removeItem("sp:bgimg")}catch(e){}return putP({bg:"ember"})};
let perfPref="auto";try{perfPref=localStorage.getItem("sp:perf")||"auto"}catch(e){}
const lowEnd=()=>(navigator.deviceMemory&&navigator.deviceMemory<=4)||(navigator.hardwareConcurrency&&navigator.hardwareConcurrency<=4);
const isLite=()=>document.documentElement.dataset.perf==="lite";
function applyPerf(){document.documentElement.dataset.perf=perfPref==="lite"||(perfPref==="auto"&&lowEnd())?"lite":"full"}
const setPerf=v=>{perfPref=v;try{localStorage.setItem("sp:perf",v)}catch(e){}applyPerf()};
const picOk=u=>typeof u==="string"&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(u);
const avatar=(p,z=40)=>{const pic=p&&picOk(p.pic);return `<span class="pav" style="width:${z}px;height:${z}px;font-size:${Math.round(z*.42)}px;${pic?`background:center/cover url('${p.pic}')`:`background:linear-gradient(145deg,${(p&&p.color)||"#d9500a"},#431407)`}">${pic?"":esc(pName(p).slice(0,1).toUpperCase())}</span>`};
async function putP(patch){const{id,...cur}=myP(),d={...cur,...patch};try{if(S.db&&S.uid)await S.db.collection("profiles").doc(S.uid).set(d);else{S.lp=d;render()}}catch(e){toast("Couldn't save your profile")}}
const saveProfile=async()=>{const v=k=>$("#"+k).value.trim();await putP({name:v("pn"),school:v("ps"),grade:v("pg"),status:v("pt"),bio:v("pb")});toast("Profile saved")};
const setColor=c=>putP({color:c});
async function loadSug(){try{if(S.user&&S.user.search){(await S.user.search("")).forEach(x=>{if(!x.isMe&&!S.sugg.some(y=>y.id===x.id))S.sugg.push({id:x.id,name:x.name})});render()}}catch(e){}}
async function doSearch(){const q=$("#fq").value.trim();S.q=q;
  try{if(q&&S.user&&S.user.search)(await S.user.search(q)).forEach(x=>{if(!x.isMe&&!S.sugg.some(y=>y.id===x.id))S.sugg.push({id:x.id,name:x.name})})}catch(e){}
  render()}
async function addFriend(id){if(!id||id===S.uid||isFriend(id))return;await save(mine(),{kind:"friend",uid:id},S.friends);toast("Friend added")}
async function addCode(){const v=$("#fc").value.trim();if(!v)return;if(v===S.uid)return toast("That's your own code");$("#fc").value="";await addFriend(v)}
const prow=(pp,btn)=>`<div class="person">${avatar(pp,42)}<div class="grow"><b>${esc(pName(pp))}</b><div class="mute">${esc([pp.school,pp.grade].filter(Boolean).join(" · ")||"No details yet")}</div>${pp.status?`<div class="mute">${esc(pp.status)}</div>`:""}</div>${btn}</div>`;
async function pickPhoto(inp){const f=inp.files&&inp.files[0];inp.value="";if(!f)return;if(!/^image\//.test(f.type)||f.size>20e6)return toast("Pick an image under 20 MB");
  try{const bm=await createImageBitmap(f),z=256,c=document.createElement("canvas");c.width=c.height=z;const m=Math.min(bm.width,bm.height);c.getContext("2d").drawImage(bm,(bm.width-m)/2,(bm.height-m)/2,m,m,0,0,z,z);await putP({pic:c.toDataURL("image/jpeg",.82)});toast("Photo updated")}catch(e){toast("Couldn't use that picture")}}
const removePhoto=()=>putP({pic:""});
function editSheet(){const p=myP(),c=p.color||AVC[0];
  return `<div class="grab"></div><div class="sh-hd"><h2>Edit profile</h2><button class="g" onclick="closeSheet()" aria-label="Close">${ic("x",18)}</button></div>
  <div class="photo">${avatar(p,78)}<div class="grow"><button class="b" onclick="$('#pf').click()">${ic("image",16)} Choose photo</button>${picOk(p.pic)?`<button class="g" onclick="removePhoto()">Remove</button>`:""}<div class="mute" style="margin-top:6px">Pick a picture from your gallery. It is resized on this device.</div></div></div>
  <input id="pf" type="file" accept="image/*" hidden onchange="pickPhoto(this)">
  <div class="f"><span class="mute">Name</span><input id="pn" value="${esc(p.name||"")}" placeholder="Your name"></div>
  <div class="f"><span class="mute">School</span><input id="ps" value="${esc(p.school||"")}" placeholder="School or university"></div>
  <div class="f"><span class="mute">Grade</span><input id="pg" value="${esc(p.grade||"")}" placeholder="e.g. Grade 10, 2nd year"></div>
  <div class="f"><span class="mute">Status</span><input id="pt" value="${esc(p.status||"")}" placeholder="What are you up to?"></div>
  <div class="f"><span class="mute">About</span><input id="pb" value="${esc(p.bio||"")}" placeholder="A short bio"></div>
  <div class="f" style="align-items:start"><span class="mute">Background</span><div><div class="bgs">${BGS.map(([id,l,g])=>`<button class="${(p.bg||"ember")===id?"on":""}" style="background:${g}" onclick="setBg('${id}')" aria-label="${l}">${l}</button>`).join("")}${bgOk?`<button class="${p.bg==="photo"?"on":""}" style="background:center/cover url('${bgimg}')" onclick="setBg('photo')" aria-label="Your photo">Photo</button>`:""}</div>
    <div class="row"><button class="chip" onclick="$('#bf').click()">${ic("image",14)} Use my own photo</button>${bgOk?`<button class="chip" onclick="removeBg()">Remove photo</button>`:""}</div><div class="mute" style="margin-top:6px">A photo background stays on this device only.</div></div></div>
  <input id="bf" type="file" accept="image/*" hidden onchange="pickBg(this)">
  <div class="f"><span class="mute">Speed</span>${pickerBtn("perf","Performance",[["auto","Auto"],["lite","Lite (faster on older phones)"],["full","Full effects"]],perfPref,setPerf)}</div>
  <div class="f"><span class="mute">Color</span><div class="sw">${AVC.map(x=>`<button class="${x===c?"on":""}" style="background:${x}" onclick="setColor('${x}')" aria-label="Color"></button>`).join("")}</div></div>
  <div class="row"><button class="b" onclick="saveProfile().then(closeSheet)">${ic("check",15)} Save profile</button></div>
  <div class="mute" style="margin-top:10px">${S.db?"Your profile is visible to everyone who has this planner's link.":"Sharing is unavailable here, so your profile stays on this device only."}</div>`}
function addSheet(){
  const pool=new Map();[...S.sugg,...S.profiles].forEach(x=>{if(x.id!==S.uid&&!isFriend(x.id)&&!pool.has(x.id))pool.set(x.id,prof(x.id))});
  const q=S.q.toLowerCase(),list=[...pool.values()].filter(x=>!q||pName(x).toLowerCase().includes(q)).slice(0,8);
  return `<div class="grab"></div><div class="sh-hd"><h2>Add friends</h2><button class="g" onclick="closeSheet()" aria-label="Close">${ic("x",18)}</button></div>
  <div class="row" style="margin-top:0"><input id="fq" placeholder="Search by name" value="${esc(S.q)}" onkeydown="if(event.key==='Enter')doSearch()"><button class="b" onclick="doSearch()">${ic("search",15)} Search</button></div>
  ${list.map(x=>prow(x,`<button class="b" onclick="addFriend('${esc(x.id)}')">${ic("uplus",15)} Add</button>`)).join("")||`<div class="mute" style="margin-top:12px">${S.q?"No one found. Try their share code below.":"No suggestions yet. People appear here once they open this planner."}</div>`}
  <div class="mute" style="margin-top:14px">Your share code</div><div class="code">${esc(S.uid||"Not available here")}</div>
  <div class="row"><input id="fc" placeholder="Paste a friend's code"><button class="b" onclick="addCode()">Add by code</button></div>`}
const EVNOTE=()=>S.db?"Events are shared with everyone who has this planner's link. Classes, deadlines and reminders are only yours.":"Sharing is unavailable here; events stay on this page only.";
function eventSheet(){const ed=S.editId&&S.events.find(x=>x.id===S.editId),own=!ed||hostOf(ed),subs=[["","No subject"],...subjectNames().map(x=>[x,x])];
  return `<div class="grab"></div><div class="sh-hd"><h2>${ed?"Edit event":"New event"}</h2><button class="g" onclick="closeSheet()" aria-label="Close">${ic("x",18)}</button></div>
  <div class="row" style="margin-top:0"><input id="et" placeholder="Title (e.g. Chapter 4 test)" value="${esc(ed?ed.title:"")}"></div>
  <div class="row">${pickerBtn("es","Subject",subs,ed?ed.sub||"":S.f||"")}</div>
  <div class="row"><input id="ed" type="date" value="${ed?ed.date:S.sel}"></div>
  <div class="row"><input id="etm" type="time" value="${esc(ed?ed.time||"":"")}" style="flex:1 1 130px"><span class="mute">to</span><input id="ete" type="time" value="${esc(ed?ed.end||"":"")}" style="flex:1 1 130px"></div>
  ${ed?"":`<div class="row">${pickerBtn("er","Repeat",[["0","Does not repeat"],["3","Weekly, 4 times"],["7","Weekly, 8 times"]],"0")}</div>`}
  ${own?inviteHtml():""}
  <div class="row"><button class="b" onclick="addEv()">${ic("check",15)} ${ed?"Save changes":"Add event"}</button></div>
  <div class="mute" style="margin-top:10px">${EVNOTE()}</div>`}
function inviteHtml(){
  if(!S.db)return `<div class="inv"><div class="mute">Inviting friends needs the online version of the planner.</div></div>`;
  if(!S.friends.length)return `<div class="inv"><h3>Invite friends</h3><div class="mute">Add friends first, then invite them here.</div><div class="row"><button class="chip" onclick="openSheet('add')">${ic("uplus",14)} Add friends</button></div></div>`;
  return `<div class="inv"><h3>Invite friends</h3><div class="mute" style="margin-bottom:6px">Invited friends see this in their calendar, to-do list and reminders.</div>${S.friends.map(f=>{const p=prof(f.uid),cur=S.iv[f.uid]||"none";return `<div class="ivr">${avatar(p,32)}<b class="grow">${esc(pName(p))}</b><div class="acc">${[["none","Off"],["view","View"],["edit","Edit"]].map(([r,l])=>`<button class="${cur===r?"on":""}" onclick="setAcc('${esc(f.uid)}','${r}')">${l}</button>`).join("")}</div></div>`}).join("")}</div>`}
const setAcc=(u,r)=>{S.iv[u]=r;drawSheet()};
const pv=(id,d="")=>S.pv[id]!==undefined?S.pv[id]:d;
const PK={};
function pickerBtn(id,title,opts,def,on){PK[id]={title,opts,def,on};const v=pv(id,def),o=opts.find(x=>x[0]===v)||opts[0];return `<button type="button" class="pk" onclick="openMenu('${id}')"><span>${esc(o[1])}</span>${ic("right",14)}</button>`}
function openMenu(id){S.menu=id;drawMenu();document.body.classList.add("menu-open")}
function closeMenu(){S.menu=null;document.body.classList.remove("menu-open")}
function drawMenu(){const m=PK[S.menu];if(!m)return;const cur=pv(S.menu,m.def);$("#menu").innerHTML=`<div class="grab"></div><div class="mt">${esc(m.title)}</div>${m.opts.map((o,i)=>`<button class="mo ${o[0]===cur?"on":""}" style="--i:${Math.min(i,9)}" onclick="pickOpt(${i})"><span>${esc(o[1])}</span>${o[0]===cur?ic("check",18):""}</button>`).join("")}`}
function pickOpt(i){const m=PK[S.menu],id=S.menu;S.pv[id]=m.opts[i][0];closeMenu();if(m.on)m.on(m.opts[i][0]);window._lh=null;S.sheet?drawSheet():render()}
function openSheet(k,id){S.sheet=k;S.fwOpen=false;S.pv={};S.iv={};S.editId=id||null;
  if(k==="event"&&id){const e=S.events.find(x=>x.id===id);if(e)(e.inv||[]).forEach(i=>S.iv[i.u]=i.r)}
  if(k==="rem"&&id){const r=RM().find(x=>x.id===id);if(r)(r.inv||[]).forEach(i=>S.iv[i.u]=i.r)}
  document.body.classList.add("sheet-open");document.body.style.overflow="hidden";drawSheet(true);drawFW()}
function closeSheet(){S.sheet=null;S.editId=null;closeMenu();document.body.classList.remove("sheet-open");document.body.style.overflow=""}
function drawSheet(fresh){if(!S.sheet)return;const el=$("#sheet"),keep={};
  if(!fresh)el.querySelectorAll("input[id]:not([type=file])").forEach(i=>{keep[i.id]=i.value});const act=!fresh&&document.activeElement&&document.activeElement.id;
  el.innerHTML=S.sheet==="edit"?editSheet():S.sheet==="event"?eventSheet():S.sheet==="rem"?remSheet():addSheet();
  for(const k in keep){const i=document.getElementById(k);if(i)i.value=keep[k]}
  if(act&&el.querySelector("#"+act))el.querySelector("#"+act).focus()}
function drawFW(){const el=$("#fw");if(!el)return;if(S.tab!=="home"){el.className="fw off";S.fwOpen=false;return}
  const fr=S.friends.map(f=>({f,p:prof(f.uid)})),n=fr.length;el.className="fw";
  el.innerHTML=(S.fwOpen?`<div class="fwpanel ${S.fwFresh?"pin":""}"><div class="hd" style="margin-bottom:4px"><b>Friends</b><button class="g" onclick="openSheet('add')">${ic("uplus",16)} Add</button></div>${fr.map(({f,p})=>`<div class="fwr">${avatar(p,34)}<div class="grow"><b>${esc(pName(p))}</b><div class="mute">${esc(p.status||[p.school,p.grade].filter(Boolean).join(" · ")||"")}</div></div><button class="g" onclick="del(mine(),'${f.id}',S.friends)" aria-label="Remove friend">${ic("x",14)}</button></div>`).join("")||'<div class="mute" style="padding:8px 2px">No friends yet.</div>'}</div>`:"")
   +`<button class="fwb" onclick="toggleFW()" aria-expanded="${!!S.fwOpen}">${n?`<span class="stack">${fr.slice(0,3).map(x=>avatar(x.p,26)).join("")}</span><span>${n} friend${n===1?"":"s"}</span>`:`${ic("uplus",16)}<span>Add friends</span>`}</button>`;S.fwFresh=false}
const toggleFW=()=>{if(!S.friends.length&&!S.fwOpen)return openSheet("add");S.fwOpen=!S.fwOpen;S.fwFresh=true;drawFW()};
document.addEventListener("click",e=>{if(S.fwOpen&&e.target.isConnected&&!e.target.closest("#fw")){S.fwOpen=false;drawFW()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(S.menu)closeMenu();else if(S.sheet)closeSheet();else if(S.fwOpen){S.fwOpen=false;drawFW()}}});
function me(){
  if(!S.sgl){S.sgl=1;loadSug()}
  const p=myP(),c=p.color||AVC[0],done=RM().filter(r=>r.done).length+S.subjects.reduce((n,s)=>n+(s.tasks||[]).filter(t=>t.done).length,0);
  const av=S.subjects.map(avg).filter(a=>a!==null),ov=av.length?dec(av.reduce((a,b)=>a+b,0)/av.length):"—";
  return `<div class="card prof"><div class="cover" style="--c1:${c}"></div><div class="pb"><div class="bigav">${avatar(p,84)}</div>
  <h2 style="margin:10px 0 2px;font-size:21px">${esc(pName(p))}</h2><div class="mute">${esc([p.school,p.grade].filter(Boolean).join(" · ")||"Tap Edit profile to add your school and grade")}</div>${p.status?`<div style="margin-top:8px;font-weight:600">${esc(p.status)}</div>`:""}${p.bio?`<p class="mute" style="margin:6px 0 0">${esc(p.bio)}</p>`:""}
  <div class="pstats"><div class="pstat"><b>${S.subjects.length}</b><span>Subjects</span></div><div class="pstat"><b>${S.friends.length}</b><span>Friends</span></div><div class="pstat"><b>${done}</b><span>Done</span></div><div class="pstat"><b>${ov}</b><span>Average</span></div></div></div></div>
  <div class="actrow"><button class="gbtn" onclick="openSheet('edit')">${ic("pencil",20)}<span>Edit profile</span></button><button class="gbtn" onclick="openSheet('add')">${ic("uplus",20)}<span>Add friends</span></button></div>
  <div class="mute" style="text-align:center;margin-top:2px">Your friends list is the floating widget on Home.</div>`;
}
function hero(){
  const now=new Date(),h=now.getHours(),today=iso(now),w=iso(new Date(Date.now()+7*864e5));
  const tasks=S.subjects.flatMap(s=>(s.tasks||[]).filter(t=>!t.done&&t.due));
  const tn=EV().filter(e=>e.date===today).length+tasks.filter(t=>t.due===today).length;
  const dn=RM().filter(r=>!r.done&&r.due&&r.due.slice(0,10)<=w).length+tasks.filter(t=>t.due<=w).length;
  const av=S.subjects.map(avg).filter(a=>a!==null),ov=av.length?av.reduce((a,b)=>a+b,0)/av.length:null;
  return `<div class="hello">${h<12?ic("sun",15)+" Good morning":h<18?ic("sun",15)+" Good afternoon":ic("moon",15)+" Good evening"}! ${now.toLocaleDateString("en",{weekday:"long",month:"long",day:"numeric"})}</div>
  <div class="stats"><div class="tile"><b data-n="${tn}">${tn}</b><span>${ic("cal",12)} Today</span></div><div class="tile"><b data-n="${dn}">${dn}</b><span>${ic("bell",12)} Due this week</span></div><div class="tile"><b data-n="${ov===null?"":(ov/100).toFixed(2)}" data-d="2">${ov===null?"—":dec(ov)}</b><span>${ic("grad",12)} Average</span></div></div>`;
}
function burst(el,big){if(isLite())return;
  const r=el.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2,cs=["#ff8a3d","#ffb26b","#e8590c","#ffd8a8","#fff"];
  for(let i=0;i<(big?10:6);i++){const b=document.createElement("span"),z=5+Math.random()*9,a=Math.random()*6.283,d=34+Math.random()*(big?70:46);
    b.className="bub";b.style.cssText=`left:${x-z/2}px;top:${y-z/2}px;width:${z}px;height:${z}px;background:${cs[i%cs.length]};--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px`;
    document.body.appendChild(b);setTimeout(()=>b.remove(),900)}
}
document.addEventListener("change",e=>{if(e.target.type==="checkbox"&&e.target.checked)burst(e.target,true)});
init();
</script></body></html>
