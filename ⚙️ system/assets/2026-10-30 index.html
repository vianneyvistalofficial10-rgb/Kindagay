<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>School Planner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#09090b;--surf:#111113;--surf2:#18181b;--card:#111113;--ink:#f4f4f5;--mute:#8b8b94;--line:#232327;--line2:#2e2e34;--acc:#d9500a;--acc2:#9a3412;--accbg:rgba(217,80,10,.14);--ok:#34d399;--bad:#f87171;--ease:cubic-bezier(.22,1,.36,1);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font:14.5px/1.5 "Inter",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;background:var(--bg)}
main{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:22px 16px 48px}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes burst{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
h1{font-size:22px;font-weight:700;margin:0 0 4px;letter-spacing:-.02em;animation:fadeUp .5s var(--ease) both}
h2{font-size:15px;font-weight:600;margin:0 0 10px;letter-spacing:-.01em}
.hello{color:var(--mute);font-size:13px;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.tile{background:var(--surf);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:12px;padding:12px 14px;animation:fadeUp .45s var(--ease) both;transition:border-color .2s,transform .25s var(--ease)}
.tile:hover{transform:translateY(-2px);border-color:var(--line2);border-left-color:var(--acc)}
.tile b{display:block;font-size:24px;font-weight:700;line-height:1.2;letter-spacing:-.02em}.tile span{font-size:11px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
nav{position:relative;display:flex;padding:4px;margin-bottom:18px;background:var(--surf);border:1px solid var(--line);border-radius:14px}
nav .ind{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/5);border-radius:10px;background:var(--acc);transition:transform .45s var(--ease)}
nav button{position:relative;flex:1;padding:8px 2px;border:0;background:none;color:var(--mute);border-radius:10px;font:inherit;font-size:11.5px;font-weight:600;cursor:pointer;transition:color .2s}
nav button:hover{color:var(--ink)}nav button:active{transform:scale(.96)}nav button.on{color:#fff}
nav button span{display:block;font-size:17px;line-height:1.25}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;transition:border-color .2s,transform .25s var(--ease),background .2s}
.card:hover{border-color:var(--line2)}
.card.click{cursor:pointer}.card.click:hover{transform:translateY(-2px);background:var(--surf2)}.card.click:active{transform:scale(.99)}
.enter .card{animation:fadeUp .7s var(--ease) both}
.enter .card:nth-child(2){animation-delay:.1s}.enter .card:nth-child(3){animation-delay:.2s}.enter .card:nth-child(n+4){animation-delay:.3s}
.empty{text-align:center;padding:24px 14px;color:var(--mute);font-weight:500}.empty .em{display:block;font-size:32px;margin-bottom:4px;animation:float 3.5s ease-in-out infinite}
input,select,button.b{font:inherit;padding:9px 12px;border:1px solid var(--line2);border-radius:10px;background:#0c0c0e;color:var(--ink);min-width:0;transition:border-color .2s,box-shadow .2s,transform .2s var(--ease),filter .2s}
input:focus,select:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--accbg)}
input::-webkit-calendar-picker-indicator{filter:invert(.65)}
button.b{background:var(--acc);color:#fff;border:0;font-weight:600;cursor:pointer}
button.b:hover{filter:brightness(1.12);transform:translateY(-1px)}button.b:active{transform:scale(.96)}
button.g{background:none;border:none;color:var(--mute);cursor:pointer;font-size:15px;padding:5px 9px;border-radius:8px;transition:background .2s,color .2s,transform .2s var(--ease)}
button.g:hover{background:var(--surf2);color:var(--ink)}button.g:active{transform:scale(.9)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}.row>input{flex:1 1 120px}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dow{font-size:11px;color:var(--mute);text-align:center;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.day{min-height:56px;border:1px solid var(--line);border-radius:10px;padding:5px 7px;font-size:12px;font-weight:600;cursor:pointer;background:#0c0c0e;overflow:hidden;transition:transform .2s var(--ease),background .2s,border-color .2s}
.day:hover{transform:scale(1.04);border-color:var(--acc)}.day:active{transform:scale(.96)}
.day.sel{background:var(--accbg);border-color:var(--acc)}
.day.today b{display:inline-block;background:var(--acc);color:#fff;border-radius:6px;padding:0 6px}
.dots{display:flex;gap:3px;margin-top:5px;flex-wrap:wrap}
.dots i{width:7px;height:7px;border-radius:50%;animation:pop .35s var(--ease) both}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line2);background:#0c0c0e;color:var(--mute);padding:5px 12px;border-radius:99px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;transition:all .2s var(--ease)}
.chip:hover{color:var(--ink);border-color:var(--acc)}.chip:active{transform:scale(.95)}.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.tag{display:inline-block;font-size:10.5px;font-weight:600;padding:1px 8px;border-radius:6px;color:#fff;margin-right:6px;letter-spacing:.01em}
.tag.cat{background:transparent;border:1px solid var(--line2);color:var(--mute)}
.mute{color:var(--mute);font-size:12.5px}.big{font-size:32px;font-weight:700;letter-spacing:-.03em}
.pill{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;vertical-align:0}
.bar{height:6px;border-radius:99px;background:var(--surf2);overflow:hidden;margin:8px 0 4px;position:relative}
.bar i{display:block;height:100%;border-radius:99px;transform-origin:left;animation:grow .8s var(--ease) both}
.bar u{position:absolute;top:0;bottom:0;width:2px;background:#fff;opacity:.25}
.ok{color:var(--ok)}.no{color:var(--bad)}
.f{display:grid;grid-template-columns:90px 1fr;gap:8px;align-items:center;margin-top:8px}.f input{width:100%}
.toast{position:fixed;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:460px;margin:auto;background:var(--surf2);color:var(--ink);font-weight:500;padding:12px 16px;border-radius:12px;border:1px solid var(--line2);border-left:3px solid var(--acc);z-index:30;box-shadow:0 12px 32px rgba(0,0,0,.6);opacity:0;transform:translateY(20px);pointer-events:none;transition:all .4s var(--ease)}
.toast.on{opacity:1;transform:none}
.done{text-decoration:line-through;opacity:.5}
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:19px;height:19px;padding:0;border-radius:6px;border:1.5px solid var(--line2);background:#0c0c0e;vertical-align:-5px;cursor:pointer;display:inline-grid;place-content:center;margin-right:6px;transition:all .25s var(--ease)}
input[type=checkbox]:hover{border-color:var(--acc)}
input[type=checkbox]:checked{background:var(--acc);border-color:var(--acc)}
input[type=checkbox]:checked::after{content:"✓";color:#fff;font-size:12px;font-weight:700;animation:pop .3s var(--ease)}
.bub{position:fixed;border-radius:50%;pointer-events:none;z-index:40;animation:burst .7s var(--ease) forwards}
nav button span{display:block}
.ph{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:18px;background:var(--accbg);border:1px solid rgba(217,80,10,.35);flex:none}
.fake{flex:1;background:#0c0c0e;border:1px solid var(--line2);border-radius:99px;padding:9px 16px;color:var(--mute);cursor:pointer;transition:border-color .2s}.fake:hover{border-color:var(--acc)}
.acts{display:flex;gap:4px;border-top:1px solid var(--line);margin-top:12px;padding-top:8px}
button.act{flex:1;font:inherit;font-weight:600;font-size:13px;color:var(--mute)}
.stories{display:flex;gap:14px;overflow-x:auto;padding:2px 2px 14px;scrollbar-width:none}.stories::-webkit-scrollbar{display:none}
.story{flex:none;width:66px;text-align:center;cursor:pointer;transition:transform .25s var(--ease);animation:fadeUp .4s var(--ease) both}.story:hover{transform:translateY(-3px)}.story:active{transform:scale(.94)}
.ring{display:grid;place-items:center;width:58px;height:58px;border-radius:50%;margin:0 auto 5px;background:var(--c,var(--acc));padding:2px}
.ring b{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--surf);border:2px solid var(--bg);font-size:19px;font-weight:700}
.ring.add{background:var(--line2)}
.story small{display:block;font-size:11px;font-weight:500;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.todo{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line)}.todo label{flex:1;cursor:pointer}
.like{font:inherit;font-weight:600;font-size:12px;background:var(--surf2);color:var(--mute);border:1px solid var(--line2);border-radius:99px;padding:3px 11px;cursor:pointer;transition:all .2s var(--ease)}.like:hover{color:var(--ink);border-color:var(--acc)}.like:active{transform:scale(.92)}.like.on{background:var(--accbg);color:#fb923c;border-color:var(--acc)}
.tip{font-size:15px;font-weight:500}
.bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.bg::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse at 50% 25%,#000,transparent 72%);mask-image:radial-gradient(ellipse at 50% 25%,#000,transparent 72%);animation:grid 50s linear infinite}
.bg i{position:absolute;border-radius:50%;filter:blur(90px);will-change:transform}
.bg i:nth-child(1){width:520px;height:520px;left:-140px;top:-170px;background:rgba(217,80,10,.27);animation:d1 20s ease-in-out infinite alternate}
.bg i:nth-child(2){width:440px;height:440px;right:-150px;top:32%;background:rgba(194,65,12,.15);animation:d2 25s ease-in-out infinite alternate}
.bg i:nth-child(3){width:400px;height:400px;left:28%;bottom:-220px;background:rgba(251,146,60,.10);animation:d3 30s ease-in-out infinite alternate}
@keyframes grid{to{background-position:44px 44px}}
@keyframes d1{to{transform:translate(170px,130px) scale(1.15)}}
@keyframes d2{to{transform:translate(-150px,-110px) scale(1.2)}}
@keyframes d3{to{transform:translate(130px,-90px) scale(1.12)}}
.ic{flex:none;vertical-align:-3px}
h1 .logo{color:var(--acc);margin-right:8px;vertical-align:-4px}
nav button span .ic{display:block;margin:0 auto 1px}
.hello{display:flex;align-items:center;gap:7px}.hello .ic{color:var(--acc)}
.tile span .ic{vertical-align:-2px;margin-right:3px}
.empty .em .ic{color:var(--acc)}.av .ic{color:#fb923c}
button.act .ic,button.g .ic{vertical-align:-3px}button.act .ic{margin-right:4px}
.like .ic{vertical-align:-2px}.ring b .ic{color:var(--mute)}
.ok .ic,.no .ic{vertical-align:-2px}
@keyframes dayIn{from{opacity:0;transform:scale(.8) translateY(8px)}to{opacity:1;transform:none}}
@keyframes navPop{0%{transform:scale(.7) translateY(4px)}55%{transform:scale(1.25) translateY(-3px)}100%{transform:none}}
@keyframes shim{to{transform:translateX(100%)}}
@keyframes rip{to{transform:scale(1);opacity:0}}
.ic{stroke-width:1.6}.ic .fl{fill:currentColor;fill-opacity:.16}
.ic{transition:transform .35s var(--ease)}
.enter .day{animation:dayIn .55s var(--ease) both;animation-delay:calc(var(--i)*16ms + .1s)}
.enter .item,.enter .todo{animation:fadeUp .6s var(--ease) .25s both}
.tile{animation-duration:.7s}.tile:nth-child(2){animation-delay:.08s}.tile:nth-child(3){animation-delay:.16s}
.story:nth-child(2){animation-delay:.06s}.story:nth-child(3){animation-delay:.12s}.story:nth-child(n+4){animation-delay:.18s}
.card:hover{box-shadow:0 14px 34px rgba(0,0,0,.5),0 0 0 1px rgba(217,80,10,.22);transform:translateY(-3px)}
.card.click:hover{transform:translateY(-4px)}
nav button.on span{animation:navPop .6s var(--ease)}
nav button:hover span .ic{transform:translateY(-2px) scale(1.12)}
button.g:hover .ic,button.act:hover .ic,.like:hover .ic{transform:scale(1.2) rotate(-6deg)}
.av{width:40px;height:40px;border-radius:13px;background:linear-gradient(145deg,rgba(217,80,10,.30),rgba(217,80,10,.06));border:1px solid rgba(217,80,10,.38);transition:transform .35s var(--ease)}
.card:hover .av{transform:rotate(-7deg) scale(1.08)}
.empty .em{display:grid;place-items:center;width:64px;height:64px;margin:0 auto 12px;border-radius:20px;background:linear-gradient(145deg,rgba(217,80,10,.26),rgba(217,80,10,.05));border:1px solid rgba(217,80,10,.32)}
button.b,.chip,button.act{position:relative;overflow:hidden}
button.b::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.28) 50%,transparent 70%);transform:translateX(-120%);transition:transform .7s var(--ease)}
button.b:hover::after{transform:translateX(120%)}
button.b:active{transform:scale(.93)}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.35);transform:scale(0);animation:rip .65s var(--ease) forwards;pointer-events:none}
.bar i{position:relative;overflow:hidden}
.bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.38),transparent);transform:translateX(-100%);animation:shim 2.8s ease-in-out 1s infinite}
.day:hover{transform:scale(1.08)}
.chip:hover{transform:translateY(-2px)}
.toast{transition:all .6s cubic-bezier(.34,1.4,.64,1)}
/* ===== Glass UI ===== */
:root{--line:transparent;--line2:transparent;--card:rgba(255,255,255,.05);--surf:rgba(255,255,255,.05);--surf2:rgba(255,255,255,.09);--glass:linear-gradient(150deg,rgba(255,255,255,.10),rgba(255,255,255,.03));--hl:inset 0 26px 40px -36px rgba(255,255,255,.09);--accbg:rgba(217,80,10,.22)}
@keyframes glassIn{from{opacity:0;transform:translateY(28px) scale(.95);filter:blur(12px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(217,80,10,0),0 0 14px rgba(217,80,10,.35)}50%{box-shadow:0 0 0 5px rgba(217,80,10,.08),0 0 24px rgba(217,80,10,.55)}}
@keyframes sheen{from{transform:translateX(-140%) skewX(-18deg)}to{transform:translateX(240%) skewX(-18deg)}}
.bg::before{background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px)}
.bg i:nth-child(1){background:rgba(217,80,10,.36)}.bg i:nth-child(2){background:rgba(220,38,38,.22)}.bg i:nth-child(3){background:rgba(251,146,60,.20)}
.card,.tile,nav{background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);border:0;box-shadow:var(--hl),0 20px 44px rgba(0,0,0,.38)}
.card{border-radius:30px;padding:20px;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(280px circle at var(--mx,50%) var(--my,0%),rgba(255,150,70,.17),transparent 62%);opacity:0;transition:opacity .45s;pointer-events:none}
.card:hover::before{opacity:1}
.card:hover{box-shadow:var(--hl),0 26px 54px rgba(0,0,0,.45),0 0 40px rgba(217,80,10,.12);transform:translateY(-4px)}
.enter .card{animation:glassIn .85s var(--ease) backwards}
.enter .item,.enter .todo{animation:fadeUp .6s var(--ease) .25s backwards}
.enter .day{animation:dayIn .6s var(--ease) backwards;animation-delay:calc(var(--i)*16ms + .1s)}
.story{animation:fadeUp .5s var(--ease) backwards}.meBtn{animation:pop .5s var(--ease) backwards}
.tile{border-radius:26px;border-left:0;padding:14px 12px;animation:fadeUp .7s var(--ease) backwards,bob 7s ease-in-out 1.2s infinite}
.tile:nth-child(2){animation-delay:.08s,2.4s}.tile:nth-child(3){animation-delay:.16s,3.6s}
.tile:hover{box-shadow:var(--hl),0 20px 44px rgba(0,0,0,.4),0 0 34px rgba(217,80,10,.2)}
.tile b{background:linear-gradient(180deg,#fff,#fdba74);-webkit-background-clip:text;background-clip:text;color:transparent}
nav{border-radius:999px;padding:6px}
nav .ind{border-radius:999px;background:linear-gradient(135deg,#f0640a,#9a3412);box-shadow:0 8px 24px rgba(217,80,10,.5),inset 0 12px 16px -14px rgba(255,255,255,.4);overflow:hidden}
nav .ind::after{content:"";position:absolute;top:0;bottom:0;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);animation:sheen 4.5s ease-in-out infinite}
nav button{border-radius:999px}
input,select{background:rgba(255,255,255,.07);border:0;border-radius:16px;box-shadow:var(--hl);padding:11px 15px}
input:focus,select:focus{background:rgba(255,255,255,.10);box-shadow:var(--hl),0 0 30px rgba(217,80,10,.45)}
select option{background:#1c1917;color:#f4f4f5}
button.b{border-radius:999px;padding:10px 20px;background:linear-gradient(135deg,#f0640a,#9a3412);box-shadow:0 10px 26px rgba(217,80,10,.42),inset 0 12px 16px -14px rgba(255,255,255,.38)}
button.b:hover{box-shadow:0 14px 34px rgba(217,80,10,.6),inset 0 12px 16px -14px rgba(255,255,255,.45);transform:translateY(-2px) scale(1.03);filter:none}
button.g{border-radius:999px}button.g:hover{background:rgba(255,255,255,.10)}
.chip{background:rgba(255,255,255,.07);border:0;border-radius:999px;box-shadow:var(--hl);padding:7px 15px}
.chip.on{background:linear-gradient(135deg,#f0640a,#9a3412);box-shadow:0 6px 18px rgba(217,80,10,.4),inset 0 12px 16px -14px rgba(255,255,255,.35)}
.day{background:rgba(255,255,255,.045);border:0;border-radius:18px;box-shadow:var(--hl)}
.day:hover{background:rgba(255,255,255,.10);transform:scale(1.1);box-shadow:var(--hl),0 10px 24px rgba(0,0,0,.4)}
.day.sel{background:linear-gradient(145deg,rgba(217,80,10,.40),rgba(217,80,10,.14));box-shadow:var(--hl),0 0 22px rgba(217,80,10,.3)}
.day.today b{background:linear-gradient(135deg,#f0640a,#9a3412);animation:glow 3s ease-in-out infinite}
.item,.todo,.person{border:0;background:rgba(255,255,255,.04);border-radius:18px;padding:11px 14px;margin-top:8px;box-shadow:var(--hl)}
.item:first-of-type{margin-top:0}
.tag{border-radius:999px;padding:2px 10px}.tag.cat{background:rgba(255,255,255,.10);border:0;color:#fdba74}
.like{border:0;background:rgba(255,255,255,.08);box-shadow:var(--hl)}.like.on{background:rgba(217,80,10,.35);color:#fdba74}
.fake{background:rgba(255,255,255,.07);border:0;box-shadow:var(--hl);border-radius:999px}
.av{border:0;border-radius:16px;background:linear-gradient(145deg,rgba(217,80,10,.5),rgba(217,80,10,.12));box-shadow:var(--hl),0 8px 20px rgba(217,80,10,.25)}
.empty .em{border:0;border-radius:26px;box-shadow:var(--hl),0 10px 30px rgba(217,80,10,.25)}
.bar{height:9px;background:rgba(255,255,255,.08)}.bar i{background-image:linear-gradient(90deg,rgba(255,255,255,.0),rgba(255,255,255,.22));box-shadow:0 0 16px rgba(217,80,10,.45)}
.ring{animation:fadeUp .5s var(--ease) backwards,glow 3.4s ease-in-out infinite}.ring b{border:0;background:#17120f}
.ring.add{background:rgba(255,255,255,.12);animation:none}
input[type=checkbox]{border:0;border-radius:50%;background:rgba(255,255,255,.18);box-shadow:none}

  if(!S.sgl){S.sgl=1;loadSug()}
  const p=myP(),c=p.color||AVC[0],done=S.rems.filter(r=>r.done).length+S.subjects.reduce((n,s)=>n+(s.tasks||[]).filter(t=>t.done).length,0);
  const av=S.subjects.map(avg).filter(a=>a!==null),ov=av.length?Math.round(av.reduce((a,b)=>a+b,0)/av.length)+"%":"—";
  const pool=new Map();[...S.sugg,...S.profiles].forEach(x=>{if(x.id!==S.uid&&!isFriend(x.id)&&!pool.has(x.id))pool.set(x.id,prof(x.id))});
  const q=S.q.toLowerCase(),list=[...pool.values()].filter(x=>!q||pName(x).toLowerCase().includes(q)).slice(0,8);
  const row=(pp,btn)=>`<div class="person">${avatar(pp,42)}<div class="grow"><b>${esc(pName(pp))}</b><div class="mute">${esc([pp.school,pp.grade].filter(Boolean).join(" · ")||"No details yet")}</div>${pp.status?`<div class="mute">${esc(pp.status)}</div>`:""}</div>${btn}</div>`;
  return `<div class="card prof"><div class="cover" style="--c1:${c}"></div><div class="pb"><div class="bigav">${avatar(p,84)}</div>
  <h2 style="margin:10px 0 2px;font-size:21px">${esc(pName(p))}</h2><div class="mute">${esc([p.school,p.grade].filter(Boolean).join(" · ")||"Add your school and grade below")}</div>${p.status?`<div style="margin-top:8px;font-weight:600">${esc(p.status)}</div>`:""}${p.bio?`<p class="mute" style="margin:6px 0 0">${esc(p.bio)}</p>`:""}
  <div class="pstats"><div class="pstat"><b>${S.subjects.length}</b><span>Subjects</span></div><div class="pstat"><b>${S.friends.length}</b><span>Friends</span></div><div class="pstat"><b>${done}</b><span>Done</span></div><div class="pstat"><b>${ov}</b><span>Average</span></div></div></div></div>
  <div class="card"><h2>Edit profile</h2>
  <div class="f"><span class="mute">Name</span><input id="pn" value="${esc(p.name||"")}" placeholder="Your name"></div>
  <div class="f"><span class="mute">School</span><input id="ps" value="${esc(p.school||"")}" placeholder="School or university"></div>
  <div class="f"><span class="mute">Grade</span><input id="pg" value="${esc(p.grade||"")}" placeholder="e.g. Grade 10, 2nd year"></div>
  <div class="f"><span class="mute">Status</span><input id="pt" value="${esc(p.status||"")}" placeholder="What are you up to?"></div>
  <div class="f"><span class="mute">About</span><input id="pb" value="${esc(p.bio||"")}" placeholder="A short bio"></div>
  <div class="f"><span class="mute">Color</span><div class="sw">${AVC.map(x=>`<button class="${x===c?"on":""}" style="background:${x}" onclick="setColor('${x}')" aria-label="Color"></button>`).join("")}</div></div>
  <div class="row"><button class="b" onclick="saveProfile()">${ic("check",15)} Save profile</button></div>
  <div class="mute" style="margin-top:8px">${S.db?"Your profile is visible to everyone who has this planner's link.":"Sharing is unavailable here, so your profile stays on this page only."}</div></div>
  <div class="card"><h2>Add friends</h2><div class="row" style="margin-top:0"><input id="fq" placeholder="Search by name" value="${esc(S.q)}" onkeydown="if(event.key==='Enter')doSearch()"><button class="b" onclick="doSearch()">${ic("search",15)} Search</button></div>
  ${list.map(x=>row(x,`<button class="b" onclick="addFriend('${esc(x.id)}')">${ic("uplus",15)} Add</button>`)).join("")||`<div class="mute" style="margin-top:12px">${S.q?"No one found. Try their share code below.":"No suggestions yet. People appear here once they open this planner."}</div>`}
  <div class="mute" style="margin-top:14px">Your share code</div><div class="code">${esc(S.uid||"Not available here")}</div>
  <div class="row"><input id="fc" placeholder="Paste a friend's code"><button class="b" onclick="addCode()">Add by code</button></div></div>
  <div class="card"><h2>Friends (${S.friends.length})</h2>${S.friends.map(f=>row(prof(f.uid),`<button class="g" title="Remove" onclick="del(mine(),'${f.id}',S.friends)">${ic("x",14)}</button>`)).join("")||'<div class="mute">No friends yet. Search above or share your code.</div>'}
  ${S.friends.length?'<div class="mute" style="margin-top:10px">Turn on the Friends filter in the Calendar to see only your events and your friends\' events.</div>':""}</div>`;
}
function hero(){
  const now=new Date(),h=now.getHours(),today=iso(now),w=iso(new Date(Date.now()+7*864e5));
  const tasks=S.subjects.flatMap(s=>(s.tasks||[]).filter(t=>!t.done&&t.due));
  const tn=S.events.filter(e=>e.date===today).length+tasks.filter(t=>t.due===today).length;
  const dn=S.rems.filter(r=>!r.done&&r.due&&r.due.slice(0,10)<=w).length+tasks.filter(t=>t.due<=w).length;
  const av=S.subjects.map(avg).filter(a=>a!==null),ov=av.length?av.reduce((a,b)=>a+b,0)/av.length:null;
  return `<div class="hello">${h<12?ic("sun",15)+" Good morning":h<18?ic("sun",15)+" Good afternoon":ic("moon",15)+" Good evening"}! ${now.toLocaleDateString("en",{weekday:"long",month:"long",day:"numeric"})}</div>
  <div class="stats"><div class="tile"><b data-n="${tn}">${tn}</b><span>${ic("cal",12)} Today</span></div><div class="tile"><b data-n="${dn}">${dn}</b><span>${ic("bell",12)} Due this week</span></div><div class="tile"><b data-n="${ov===null?"":Math.round(ov)}" data-s="%">${ov===null?"—":Math.round(ov)+"%"}</b><span>${ic("grad",12)} Average</span></div></div>`;
}
function burst(el,big){
  const r=el.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2,cs=["#ff8a3d","#ffb26b","#e8590c","#ffd8a8","#fff"];
  for(let i=0;i<(big?10:6);i++){const b=document.createElement("span"),z=5+Math.random()*9,a=Math.random()*6.283,d=34+Math.random()*(big?70:46);
    b.className="bub";b.style.cssText=`left:${x-z/2}px;top:${y-z/2}px;width:${z}px;height:${z}px;background:${cs[i%cs.length]};--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px`;
    document.body.appendChild(b);setTimeout(()=>b.remove(),900)}
}
document.addEventListener("change",e=>{if(e.target.type==="checkbox"&&e.target.checked)burst(e.target,true)});
init();
</script></body></html>
